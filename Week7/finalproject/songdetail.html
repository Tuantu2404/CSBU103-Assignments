<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title id="pageTitle">Chi tiết Bài hát</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="custom_style.css">
</head>
<body>
    <div class="container song-detail-container">
        <h2 id="songTitle"></h2>
        <p class="detail-info"><strong>Nghệ sĩ:</strong> <span id="songArtist"></span></p>
        <p class="detail-info"><strong>Đăng bởi:</strong> <span id="songUser"></span></p>
        <hr>

        <div class="lyrics-chords">
            <pre id="lyricsContent">Đang tải chi tiết bài hát...</pre> 
        </div>

        <p class="mt-4"><a href="songlist.html" class="btn btn-primary btn-sm">Quay lại danh sách bài hát</a></p>
    </div>
    

    <script>
        const API_BASE_URL = 'http://localhost:3000/api';
        const lyricsContentElement = document.getElementById('lyricsContent');
        
        // --- CHỨC NĂNG TÔ MÀU HỢP ÂM (ĐƯA RA NGOÀI HÀM) ---
        function highlightChords(text) {
            if (!text) return '';
            // Thay thế [Am] thành <span class="chord">Am</span>. 
            // Dùng capture group (.*?) để lấy nội dung bên trong []
            return text.replace(/\[(.*?)\]/g, (match, chord) => {
                return `<span class="chord">${chord}</span>`;
            });
        }
        
        async function fetchSongDetails() {
            let songId = null;

            // Lấy ID từ URL (ví dụ: songdetail.html?id=123)
            const params = new URLSearchParams(window.location.search);
            songId = params.get('id'); 
            
            if (!songId) {
                lyricsContentElement.textContent = 'Lỗi: Không tìm thấy ID bài hát trong URL.';
                document.getElementById('pageTitle').textContent = 'Lỗi';
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/songs/${songId}`);
                
                if (!response.ok) { 
                    const errorData = await response.json().catch(() => ({ message: 'Lỗi không xác định từ Server.' }));
                    lyricsContentElement.textContent = `Lỗi Server (${response.status}): ${errorData.message || 'Không thể tải dữ liệu.'}`;
                    return;
                }

                const song = await response.json();
                
                // Lấy tên người dùng (Xử lý trường hợp user_id không tồn tại hoặc không có username)
                const username = song.user_id && song.user_id.username ? song.user_id.username : 'Người dùng ẩn danh';

                // --- HIỂN THỊ DỮ LIỆU ---
                document.getElementById('pageTitle').textContent = song.title || 'Chi tiết Bài hát';
                document.getElementById('songTitle').textContent = song.title || 'Không tiêu đề';
                document.getElementById('songArtist').textContent = song.artist || 'Không rõ';
                document.getElementById('songUser').textContent = username;
                
                // 🛑 SỬA LỖI QUAN TRỌNG: 
                // 1. Áp dụng hàm highlightChords
                // 2. Dùng .innerHTML để cho phép thẻ <span> (hợp âm màu đỏ) hiển thị
                const formattedLyrics = highlightChords(song.lyrics_chords || 'Nội dung trống.');
                lyricsContentElement.innerHTML = formattedLyrics; 

            } catch (error) {
                // Lỗi kết nối mạng
                lyricsContentElement.textContent = `Lỗi kết nối mạng/Server: ${error.message}. Vui lòng kiểm tra cổng 3000.`;
                console.error('Lỗi khi tải chi tiết bài hát:', error);
            }
        }

        window.onload = fetchSongDetails;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
