<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký & Đăng nhập - Kho Hợp Âm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="custom_style.css">
</head>
<body class="container mt-5">

    <div class="row">
        <div class="col-md-6">
            <h2>Đăng ký Tài khoản Mới</h2>
            <form id="registerForm" class="p-3 border rounded shadow-sm mb-4">
                <div class="mb-3">
                    <label for="reg_username" class="form-label">Tên đăng nhập:</label>
                    <input type="text" id="reg_username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="reg_email" class="form-label">Email:</label>
                    <input type="email" id="reg_email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="reg_password" class="form-label">Mật khẩu:</label>
                    <input type="password" id="reg_password" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Đăng ký</button>
            </form>
            <p id="reg_message" class="message"></p>
        </div>

        <div class="col-md-6">
            <h2>Đăng nhập</h2>
            <form id="loginForm" class="p-3 border rounded shadow-sm mb-4">
                <div class="mb-3">
                    <label for="login_email" class="form-label">Email:</label>
                    <input type="email" id="login_email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="login_password" class="form-label">Mật khẩu:</label>
                    <input type="password" id="login_password" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-success">Đăng nhập</button>
            </form>
            <p id="login_message" class="message"></p>
        </div>
    </div>
    
    <p class="mt-4"><a href="songlist.html">Xem danh sách bài hát công khai</a></p>

    <script>
        // Thiết lập URL cơ sở cho API
        const API_BASE_URL = 'http://localhost:3000/api/auth';

        // --- Logic Đăng ký (Register) ---
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('reg_username').value;
            const email = document.getElementById('reg_email').value;
            const password = document.getElementById('reg_password').value;
            const messageElement = document.getElementById('reg_message');
            messageElement.textContent = 'Đang xử lý...';
            messageElement.className = 'message text-warning';

            try {
                const response = await fetch(`${API_BASE_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password }),
                });

                const data = await response.json();

                if (response.status === 201) {
                    messageElement.textContent = 'Đăng ký thành công! Vui lòng đăng nhập.';
                    messageElement.className = 'message text-success';
                    document.getElementById('registerForm').reset();
                } else {
                    messageElement.textContent = `Lỗi đăng ký: ${data.message || 'Lỗi không xác định'}`;
                    messageElement.className = 'message text-danger';
                }
            } catch (error) {
                messageElement.textContent = 'Lỗi kết nối Server.';
                messageElement.className = 'message text-danger';
                console.error('Lỗi:', error);
            }
        });


        // --- Logic Đăng nhập (Login) ---
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('login_email').value;
            const password = document.getElementById('login_password').value; 
            const messageElement = document.getElementById('login_message');
            messageElement.textContent = 'Đang đăng nhập...';
            messageElement.className = 'message text-warning';


            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) { // response.ok tương đương với status 200
                    
                    localStorage.setItem('jwtToken', data.token);   
                    
                    // Lấy vai trò (role) từ phản hồi của Server (CẦN BACKEND TRẢ VỀ userRole)
                    const userRole = data.userRole; 
                    
                    messageElement.textContent = 'Đăng nhập thành công! Chuyển hướng...';
                    messageElement.className = 'message text-success';
                    
                    // CHUYỂN HƯỚNG DỰA TRÊN VAI TRÒ
                    setTimeout(() => {
                        if (userRole === 'admin') {
                            window.location.href = 'admin.html'; // Chuyển đến trang Admin
                        } else {
                            window.location.href = 'upload.html'; // Chuyển người dùng thường
                        }
                    }, 1000);

                } else {
                    messageElement.textContent = `Đăng nhập thất bại: ${data.message || 'Sai email hoặc mật khẩu'}`;
                    messageElement.className = 'message text-danger';
                }
            } catch (error) {
                messageElement.textContent = 'Lỗi kết nối Server. Vui lòng kiểm tra Node.js server.';
                messageElement.className = 'message text-danger';
                console.error('Lỗi:', error);
            }
        });
    </script>
</body>
</html>
