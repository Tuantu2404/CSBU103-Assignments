<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng tải Bài hát</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="custom_style.css">
</head>
<body>
    <h2>Đăng tải Bài hát Mới</h2>
    <p>Sử dụng định dạng [Am] Lời bài hát để ghi hợp âm.</p>
    
    <form id="uploadForm">
        <label for="title">Tiêu đề Bài hát:</label><br>
        <input type="text" id="title" name="title" required><br><br>
        
        <label for="artist">Ca sĩ/Tác giả:</label><br>
        <input type="text" id="artist" name="artist"><br><br>
        
        <label for="lyrics_chords">Nội dung (Lời & Hợp âm):</label><br>
        <textarea id="lyrics_chords" name="lyrics_chords" rows="10" required></textarea><br><br>
        
        <button type="submit">Đăng tải</button>
    </form>

    <p id="message" class="message"></p> 

    <p><a href="songlist.html">Xem danh sách bài hát</a> | <a href="login.html">Đăng xuất</a></p>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
    // Chúng ta sử dụng key 'jwtToken' theo code đăng nhập đã sửa
    const token = localStorage.getItem('jwtToken'); 

    if (!token) {
        // Nếu không có Token, chuyển hướng đến trang đăng nhập
        alert('Vui lòng đăng nhập để đăng tải bài hát.');
        window.location.href = 'login.html'; // Hoặc đường dẫn đến trang đăng nhập của bạn
    }

    // Nếu có Token, code còn lại của trang upload sẽ được thực thi
});
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // 1. Lấy dữ liệu và Phần tử hiển thị thông báo
            const title = document.getElementById('title').value;
            const artist = document.getElementById('artist').value;
            const lyrics_chords = document.getElementById('lyrics_chords').value; 
            
            // Lấy phần tử thông báo
            const messageElement = document.getElementById('message');
            
            messageElement.textContent = 'Đang tải bài hát...';
            messageElement.className = 'message';

            // 2. Lấy Token từ Local Storage
            const token = localStorage.getItem('jwtToken'); 
            if (!token) {
                messageElement.textContent = 'Lỗi: Vui lòng đăng nhập lại (Token không tồn tại).';
                messageElement.classList.add('error');
                // Chuyển hướng về trang login nếu không có token
                setTimeout(() => { window.location.href = 'login.html'; }, 2000); 
                return;
            }

            // 3. Gửi Yêu cầu POST có Token xác thực
            try {
                const response = await fetch('http://localhost:3000/api/songs', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` // PHẢI CÓ 'Bearer '
                    },
                    body: JSON.stringify({ title, artist, lyrics_chords })
                });

                const data = await response.json();

                if (response.ok) { // Status 201 Created
                    messageElement.textContent = `Bài hát đã được đăng thành công! ID: ${data.songId}`;
                    messageElement.classList.add('success');
                    
                    // Xóa form và Tự động chuyển hướng
                    document.getElementById('uploadForm').reset();
                    setTimeout(() => {
                        messageElement.textContent = 'Chuyển hướng đến danh sách bài hát...';
                        window.location.href = 'songlist.html'; 
                    }, 1500); 

                } else if (response.status === 401 || response.status === 403) {
                    // Nếu token hết hạn/không hợp lệ
                    messageElement.textContent = 'Lỗi: Token hết hạn. Vui lòng đăng nhập lại.';
                    messageElement.classList.add('error');
                    localStorage.removeItem('jwtToken');
                } 
                else {
                    messageElement.textContent = `Đăng tải thất bại: ${data.message || 'Lỗi không xác định'}`;
                    messageElement.classList.add('error');
                }
            } catch (error) {
                messageElement.textContent = 'Lỗi kết nối Server. Vui lòng kiểm tra Node.js server.';
                messageElement.classList.add('error');
                console.error('Lỗi:', error);
            }
        });
    </script>
</body>
</html>
