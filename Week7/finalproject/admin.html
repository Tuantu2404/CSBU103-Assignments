<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị - Duyệt Bài Hát</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="custom_style.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* CSS riêng cho trang Admin */
        .admin-song-item {
            border-left: 5px solid #f39c12; /* Màu cam cảnh báo cho bài pending */
        }
        .pending-badge {
            font-size: 0.8em;
        }
        .lyrics-preview {
            max-height: 100px;
            overflow: hidden;
            border-top: 1px dashed #ccc;
            padding-top: 10px;
            margin-top: 10px;
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="container upload-container">
        <h2>Quản Lý Bài Hát Chờ Duyệt</h2>
        <p class="text-secondary">Chỉ tài khoản Admin mới có thể truy cập trang này.</p>
        
        <div id="pendingSongsList" class="mt-4">
            <p class="text-info">Đang tải danh sách bài hát...</p>
        </div>
        
        <p class="mt-5"><a href="songlist.html" class="btn btn-secondary">Quay lại Trang Chủ</a></p>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3000/api';
        const pendingSongsList = document.getElementById('pendingSongsList');

        // Hàm kiểm tra quyền Admin khi tải trang
        function checkAdminRole() {
            const token = localStorage.getItem('jwtToken');
            if (!token) {
                alert('Vui lòng đăng nhập bằng tài khoản Admin.');
                window.location.href = 'login.html';
                return false;
            }
            // Logic kiểm tra role thực tế sẽ phức tạp hơn (cần giải mã token hoặc gọi API). 
            // Tạm thời, chúng ta sẽ dựa vào phản hồi của API để xác định quyền.
            return token;
        }

        // --- 1. Lấy danh sách bài hát đang chờ duyệt ---
        async function fetchPendingSongs(token) {
            pendingSongsList.innerHTML = '<p class="text-info">Đang tải danh sách bài hát...</p>';
            try {
                // LƯU Ý: Backend cần có route /admin/songs/pending được bảo vệ bằng adminMiddleware
                const response = await fetch(`${API_BASE_URL}/songs/pending`, {
                    headers: { 
                        'Authorization': `Bearer ${token}` 
                    }
                });

                if (response.status === 403) {
                    pendingSongsList.innerHTML = '<p class="message error">Bạn không có quyền truy cập trang quản trị này.</p>';
                    return;
                }
                
                if (!response.ok) {
                    const errorData = await response.json();
                    pendingSongsList.innerHTML = `<p class="message error">Lỗi tải dữ liệu: ${errorData.message || 'Lỗi không xác định'}</p>`;
                    return;
                }

                const songs = await response.json();
                renderSongs(songs);

            } catch (error) {
                pendingSongsList.innerHTML = `<p class="message error">Lỗi kết nối Server: Vui lòng kiểm tra Node.js server.</p>`;
                console.error('Lỗi khi tải bài hát chờ duyệt:', error);
            }
        }

        // --- 2. Xử lý logic Duyệt/Từ chối ---
        async function handleApprove(songId, status) {
            const token = checkAdminRole();
            if (!token) return;

            if (!confirm(`Bạn có chắc chắn muốn ${status === 'approved' ? 'DUYỆT' : 'TỪ CHỐI'} bài hát này không?`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/songs/${songId}/approve`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: status })
                });

                if (response.ok) {
                    alert(`Bài hát ID ${songId} đã được cập nhật trạng thái thành công.`);
                    fetchPendingSongs(token); // Tải lại danh sách sau khi cập nhật
                } else {
                    const data = await response.json();
                    alert(`Lỗi khi duyệt bài: ${data.message}`);
                }
            } catch (error) {
                alert('Lỗi kết nối hoặc Server không phản hồi.');
            }
        }

        // --- 3. Render danh sách bài hát ra HTML ---
        function renderSongs(songs) {
            if (songs.length === 0) {
                pendingSongsList.innerHTML = '<p class="alert alert-success">Không có bài hát nào đang chờ duyệt.</p>';
                return;
            }

            const html = songs.map(song => `
                <div class="song-item card p-3 admin-song-item" data-id="${song._id}">
                    <span class="badge bg-warning pending-badge mb-2">Đang Chờ Duyệt</span>
                    <h3>${song.title || 'Không tiêu đề'} (${song.artist || 'Không rõ'})</h3>
                    <p class="text-muted mb-2">Đăng bởi: <strong>${song.user_id ? song.user_id.username : 'Ẩn danh'}</strong></p>
                    
                    <div class="lyrics-preview">
                        ${song.lyrics_chords.substring(0, 150)}...
                    </div>
                    
                    <div class="mt-3">
                        <a href="songdetail.html?id=${song._id}" class="btn btn-info btn-sm me-2">Xem chi tiết</a>
                        <button onclick="handleApprove('${song._id}', 'approved')" class="btn btn-success btn-sm me-2">Duyệt</button>
                        <button onclick="handleApprove('${song._id}', 'rejected')" class="btn btn-danger btn-sm">Từ chối</button>
                    </div>
                </div>
            `).join('');

            pendingSongsList.innerHTML = html;
        }

        // Khởi động
        const token = checkAdminRole();
        if (token) {
            fetchPendingSongs(token);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
